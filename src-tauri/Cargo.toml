[package]
name = "app"
# Not the app version — that lives in tauri.conf.json, which is what names the
# DMG and fills CFBundleShortVersionString. Nothing reads this one.
version = "0.0.0"
description = "A personal, local-first log of short work notes"
authors = ["Rafael Passos"]
license = "MIT"
repository = "https://github.com/rcpassos/work-journal-ai"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# The same sqlx the plugin uses, so `journal_transaction` runs its statements on
# the plugin's own pool — see docs/adr/0020-recurring-task-transitions-are-transactional.md.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2.3.2"
# The API Key, in the OS keychain rather than in the plaintext settings file —
# see docs/adr/0026-the-api-key-lives-in-the-keychain-and-rust-makes-the-call.md.
keyring = "4.2.0"
# The model call behind a Work Summary — the first network call the app has
# ever made, made from Rust so the API Key never enters the webview; see
# docs/adr/0026-the-api-key-lives-in-the-keychain-and-rust-makes-the-call.md.
# Already in the tree through tauri and locked at 0.13.4. Default features are
# dropped for native-tls, which on macOS is the system's own Security
# framework — the smallest TLS addition there is, and the trust store the OS
# already manages.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# The save dialog behind the manual backup — and #161's open dialog after it.
tauri-plugin-dialog = { version = "2.7.3" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The calendar an Import reads, and the wake notification that makes it look
# again — see src-tauri/src/calendar.rs.
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKEvent",
    "EKCalendar",
    "EKCalendarItem",
    "EKParticipant",
    "EKSource",
    "EKTypes",
    "EKStructuredLocation",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDate",
    "NSArray",
    "NSSet",
    "NSTimeZone",
    "NSCalendar",
    "NSError",
    "NSDictionary",
    "NSValue",
    "NSPredicate",
    "NSObject",
    "NSBundle",
    "NSURL",
] }
block2 = "0.6"
# The Task Alerts macOS holds and delivers on its own — see
# src-tauri/src/alerts.rs and docs/adr/0017-the-os-schedules-task-alerts.md.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationTrigger",
    "UNNotificationSettings",
    "UNNotificationResponse",
    "UNNotification",
    "UNNotificationSound",
    "UNNotificationAction",
    "UNNotificationCategory",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# The newer release, fetched and installed by the app itself — see
# docs/adr/0030-the-app-updates-itself-from-its-own-releases.md. `process` is
# what puts the user back into the version they just installed.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
